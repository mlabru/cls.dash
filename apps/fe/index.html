<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Dashboard STSC</title>

    <!-- sem "?v=": o fe_server.py manda "Cache-Control: no-cache" e o navegador
         revalida o app.js/style.css a cada carga (304 se não mudaram). Servindo
         por outro servidor (nginx etc.), configure o mesmo cabeçalho -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header id="page-header">
        <span id="page-title"></span>
        <span id="page-notice"></span>
    </header>

    <div id="dashboard"></div>

    <div id="progress-bar">
        <div id="progress-fill"></div>
    </div>

    <!-- backend em outra máquina/porta: descomente e ajuste (ver resolveApiBase em app.js)
    <script>window.DASH_API_BASE = "http://servidor:8000";</script>
    -->
    <script src="app.js"></script>

</body>
</html>
