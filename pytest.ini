[pytest]
testpaths =
    apps/be/test
    test
norecursedirs = .bkp .git __pycache__ node_modules .venv
# o Plotly Dash (instalado no ~/.venv) registra um plugin de pytest chamado
# "dash" que importa o pacote dash do Plotly antes do conftest; aí
# "import dash.dsh_config" falha. Sem o Plotly, a opção é ignorada.
addopts = -p no:dash
